name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux: solução completa, incluindo os testes relacionais contra um PostgreSQL real.
  build:
    name: build-and-test (ubuntu-latest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          # Senha descartável do PostgreSQL de teste do CI; o serviço só existe durante o job.
          POSTGRES_PASSWORD: ags_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AGS_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=ags_test_only
    steps:
      - uses: actions/checkout@v4

      - name: Verificar se a solução existe
        id: solution
        shell: bash
        run: |
          if [ -f Ags.Finance.slnx ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "Solução ainda não criada; nada para compilar."; fi

      - uses: actions/setup-dotnet@v4
        if: steps.solution.outputs.exists == 'true'
        with:
          global-json-file: global.json

      - name: Restore
        if: steps.solution.outputs.exists == 'true'
        run: dotnet restore Ags.Finance.slnx

      - name: Build
        if: steps.solution.outputs.exists == 'true'
        run: dotnet build Ags.Finance.slnx --no-restore --configuration Release

      - name: Test
        if: steps.solution.outputs.exists == 'true'
        run: dotnet test Ags.Finance.slnx --no-build --configuration Release

      - name: Format
        if: steps.solution.outputs.exists == 'true'
        run: dotnet format Ags.Finance.slnx --verify-no-changes --no-restore

  # Windows: compila a solução e roda os testes que não dependem do PostgreSQL (domínio e arquitetura).
  # Os testes relacionais exigem um servidor Linux e rodam no job acima; no Windows local, use o WSL 2.
  build-windows:
    name: build-and-test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Ags.Finance.slnx

      - name: Build
        run: dotnet build Ags.Finance.slnx --no-restore --configuration Release

      - name: Test (domínio e arquitetura)
        shell: bash
        run: |
          for project in tests/Ags.Finance.ArchitectureTests tests/Ags.Finance.SharedKernel.Tests; do
            dotnet test "$project" --no-build --configuration Release
          done

  # Imagem e Compose: constrói a imagem, sobe aplicação e PostgreSQL e exercita backup e restauração em instalação
  # vazia (scripts/rehearse-recovery.sh). Valida sem publicar nada; a publicação é feita só por tag (release.yml).
  docker:
    name: docker-image-and-recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar o Compose
        run: POSTGRES_PASSWORD=ci AGS_DB_PASSWORD=ci AGS_HOST_NAMES=localhost docker compose config --quiet

      - name: Ensaio de recuperação (dados fictícios)
        run: scripts/rehearse-recovery.sh
