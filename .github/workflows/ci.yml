name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Verificar se a solução existe
        id: solution
        shell: bash
        run: |
          if [ -f Ags.Finance.slnx ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "Solução ainda não criada; nada para compilar."; fi

      - uses: actions/setup-dotnet@v4
        if: steps.solution.outputs.exists == 'true'
        with:
          global-json-file: global.json

      - name: Restore
        if: steps.solution.outputs.exists == 'true'
        run: dotnet restore Ags.Finance.slnx

      - name: Build
        if: steps.solution.outputs.exists == 'true'
        run: dotnet build Ags.Finance.slnx --no-restore --configuration Release

      - name: Test
        if: steps.solution.outputs.exists == 'true'
        run: dotnet test Ags.Finance.slnx --no-build --configuration Release

      - name: Format
        if: steps.solution.outputs.exists == 'true' && matrix.os == 'ubuntu-latest'
        run: dotnet format Ags.Finance.slnx --verify-no-changes --no-restore
