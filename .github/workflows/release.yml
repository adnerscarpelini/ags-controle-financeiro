name: Release

# Publica a imagem versionada no GHCR quando uma tag vX.Y.Z é criada. Pull requests não publicam nada (veja ci.yml).
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: publish-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versão da imagem
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ steps.version.outputs.value }}
          tags: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.value }}
