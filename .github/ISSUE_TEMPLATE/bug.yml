name: Bug
description: Um comportamento implementado que não funciona como deveria.
title: "[<Module>] Corrigir <problema>"
labels: ["bug"]
body:
  - type: dropdown
    id: module
    attributes:
      label: Módulo
      options:
        - Attachments
        - Identity
        - Accounts
        - Transactions
        - Invoices
        - Reimbursements
        - Preferences
        - Reports
        - Imports
        - Web
        - Transversal
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      description: Use dados fictícios.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportamento obtido
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit ou versão
