<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Servidor não encontrado</title>
    <link rel="stylesheet" href="/css/tokens.css" />
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: var(--space-4); background: var(--color-background); color: var(--color-text-primary); font-family: var(--font-sans); line-height: 1.5; }
        main { max-width: 28rem; text-align: center; }
        img { width: 96px; height: 96px; border-radius: var(--radius); }
        h1 { margin: var(--space-4) 0 var(--space-2); font-size: 1.5rem; }
        p { margin: 0 0 var(--space-4); color: var(--color-text-secondary); }
        button { min-height: var(--touch-target); padding: 0 var(--space-4); border: 0; border-radius: var(--radius); background: var(--color-accent); color: var(--color-background); font: inherit; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <img src="/img/icon-192.png" alt="" width="96" height="96" />
        <h1>Não encontrei o servidor</h1>
        <p>O AGS Controle Financeiro não respondeu. Confira se o computador que hospeda o sistema está ligado e se este aparelho está na mesma rede. Seus dados continuam guardados no servidor.</p>
        <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
</body>
</html>
