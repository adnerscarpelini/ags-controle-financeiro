# Aplicação + PostgreSQL. Linux (Docker Engine) ou Windows com Docker Engine dentro do WSL 2.
# Configuração: copie .env.example para .env e preencha (veja docs/web/docker-deployment.md).
name: ags-finance

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      AGS_DB_NAME: ${AGS_DB_NAME:-ags_finance}
      AGS_DB_USER: ${AGS_DB_USER:-ags_app}
      AGS_DB_PASSWORD: ${AGS_DB_PASSWORD:?defina AGS_DB_PASSWORD no .env}
      TZ: ${AGS_TIMEZONE:-America/Sao_Paulo}
    volumes:
      - db-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # Sem "ports": o banco só é acessível pela rede interna do Compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 60s

  app:
    image: ghcr.io/adnerscarpelini/ags-controle-financeiro:${AGS_VERSION:-dev}
    build:
      context: .
      args:
        VERSION: ${AGS_VERSION:-0.0.0-dev}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Finance: Host=db;Port=5432;Database=${AGS_DB_NAME:-ags_finance};Username=${AGS_DB_USER:-ags_app};Password=${AGS_DB_PASSWORD:?defina AGS_DB_PASSWORD no .env}
      # Nomes e IPs pelos quais os dispositivos da rede acessam este computador (entram no certificado HTTPS).
      Hosting__Names: ${AGS_HOST_NAMES:?defina AGS_HOST_NAMES no .env com os nomes/IPs do computador}
      Database__ReadyTimeoutSeconds: ${AGS_DB_READY_TIMEOUT:-60}
      Attachments__Directory: /attachments
      Backup__Directory: /backups
      Backup__ScheduleTime: ${AGS_BACKUP_TIME:-02:00}
      Backup__RetentionDays: ${AGS_BACKUP_RETENTION:-30}
      TZ: ${AGS_TIMEZONE:-America/Sao_Paulo}
    ports:
      # Único serviço publicado na LAN: o HTTPS da aplicação.
      - "${AGS_PORT:-5280}:5280"
    volumes:
      - type: bind
        source: ${AGS_ATTACHMENTS_DIR:-./attachments}
        target: /attachments
        bind:
          create_host_path: false
      - app-data:/data
      - ${AGS_BACKUP_DIR:-./backups}:/backups
    stop_grace_period: 30s

volumes:
  db-data:
  app-data:
